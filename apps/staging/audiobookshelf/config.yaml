apiVersion: v1
kind: ConfigMap
metadata:
  name: abs-config
data:
  config.yaml: |
  tunnel: abs
  credentials-file: /etc/cloudflared/creds/credentials.json
  metrics: 0.0.0.0:2000
  no-autoupdate: true

  ingress:
  - hostname: abs.ember-ci.com
    service: http://audiobookshelf:3005
  - service: http_status:404
